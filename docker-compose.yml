version: "3.9"

# ============================================================
#  Docker Compose — Ecommerce Microservices
#  Orden de arranque: config → eureka → oauth → personas → productos → gateway
# ============================================================

services:

  # ----------------------------------------------------------
  # 1. Config Server  (debe arrancar primero)
  # ----------------------------------------------------------
  # config-server:
  #   build:
  #     context: ./ectemplate-service-config-server
  #     dockerfile: ../Dockerfile
  #   container_name: ectemplate-config-server
  #   ports:
  #     - "8888:8888"
  #   networks:
  #     - ectemplate-net
  #   healthcheck:
  #     test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8888/actuator/health"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 10
  #     start_period: 30s

  # ----------------------------------------------------------
  # 2. Eureka Server
  # ----------------------------------------------------------
  eureka-server:
    build:
      context: ./ectemplate-servicio-eureka-server
      dockerfile: ../Dockerfile
    container_name: ectemplate-eureka-server
    ports:
      - "8761:8761"
    networks:
      - ectemplate-net
    depends_on:
      config-server:
        condition: service_healthy
    # environment:
    #   - SPRING_CLOUD_CONFIG_URI=http://config-server:8888
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ----------------------------------------------------------
  # 3. OAuth Service
  # ----------------------------------------------------------
  oauth:
    build:
      context: ./ectemplate-service-oauth
      dockerfile: ../Dockerfile
    container_name: ectemplate-oauth
    ports:
      - "9100:9100"
    networks:
      - ectemplate-net
    depends_on:
      eureka-server:
        condition: service_healthy
    environment:
      # - SPRING_CLOUD_CONFIG_URI=http://config-server:8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - EUREKA_INSTANCE_PREFER_IP_ADDRESS=true

  # ----------------------------------------------------------
  # 4. Servicio Personas
  # ----------------------------------------------------------
  personas:
    build:
      context: ./ectemplate-servicio-personas
      dockerfile: ../Dockerfile
    # container_name: ectemplate-personas
    # ports:
    #   - "8001:8001"
    networks:
      - ectemplate-net
    depends_on:
      eureka-server:
        condition: service_healthy
    environment:
      # - SPRING_CLOUD_CONFIG_URI=http://config-server:8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SERVER_PORT=0
      - EUREKA_INSTANCE_PREFER_IP_ADDRESS=true  # usa IP en vez de hostname al escalar

  # ----------------------------------------------------------
  # 5. Servicio Productos
  # ----------------------------------------------------------
  productos:
    build:
      context: ./ectemplate-servicio-productos
      dockerfile: ../Dockerfile
    container_name: ectemplate-productos
    ports:
      - "8002:8002"
    networks:
      - ectemplate-net
    depends_on:
      eureka-server:
        condition: service_healthy
    environment:
      # - SPRING_CLOUD_CONFIG_URI=http://config-server:8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - SERVER_PORT=0
      - EUREKA_INSTANCE_PREFER_IP_ADDRESS=true  # usa IP en vez de hostname al escalar

  # ----------------------------------------------------------
  # 6. Gateway
  # ----------------------------------------------------------
  gateway:
    build:
      context: ./ectemplate-servicio-gateway
      dockerfile: ../Dockerfile
    container_name: ectemplate-gateway
    ports:
      - "8090:8090"
    networks:
      - ectemplate-net
    depends_on:
      eureka-server:
        condition: service_healthy
    environment:
      # - SPRING_CLOUD_CONFIG_URI=http://config-server:8888
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - EUREKA_INSTANCE_PREFER_IP_ADDRESS=true

# ============================================================
networks:
  ectemplate-net:
    driver: bridge
