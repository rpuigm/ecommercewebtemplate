spring:
  cloud:
    gateway:
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
            - GET
            - PUT
            - DELETE
            - POST
            allowedHeaders: "*"
      routes:
      - id: servicio-productos
        uri: lb://servicio-productos
        predicates:
          - Path=/api/productos/**
        filters:
          - StripPrefix=2
      - id: servicio-personas
        uri: lb://servicio-personas
        predicates:
          - Path=/api/personas/**
        filters:
          - StripPrefix=2

          
          

          
      